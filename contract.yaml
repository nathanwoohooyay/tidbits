  /api/logs/transactions/accounts/{accountId}:
    get:
      tags:
        - Logs
      summary: Get transaction logs by account
      description: Retrieve all transaction logs for a specific account
      operationId: getTransactionLogsByAccountId
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of transaction logs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionLog'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== LOGS - USER ====================
  /api/logs/users:
    get:
      tags:
        - Logs
      summary: Get all user logs
      description: Retrieve all user activity audit logs in the system
      operationId: getAllUserLogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user logs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserLog'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/logs/users/{userId}:
    get:
      tags:
        - Logs
      summary: Get user log by ID
      description: Retrieve a specific user log entry
      operationId: getUserLogById
      security:
