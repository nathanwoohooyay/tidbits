server {

    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html/browser;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Missing prize thumbnails must 404 so the page falls back to its placeholder tile.
    location /prizes/ {
        root /usr/share/nginx/html/browser;
        try_files $uri =404;
    }

    location /api/auth {
        proxy_pass http://tidbits-auth-service:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://gateway:3000/client/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}