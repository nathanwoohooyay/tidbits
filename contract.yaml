        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/pricing/quotes:
    get:
      tags:
        - Pricing
      summary: Get batch market quotes
      description: |
        Returns quote data for one or more comma-separated symbols.

        `refresh=true` forces the pricing service to bypass cached data when possible.
      operationId: getQuotes
      security:
        - BearerAuth: []
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated list of market symbols.
          schema:
            type: string
            example: AAPL,MSFT,INFY.NS
        - name: refresh
          in: query
          required: false
          description: Whether to force a fresh upstream fetch.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Quotes retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingBatchResponseDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/pricing/candles/{symbol}:
    get:
      tags:
        - Pricing
      summary: Get historical candles for a symbol
      description: |
        Returns candle data for the requested symbol and interval.

        When the pricing service has accepted a backfill job but does not yet have candles available, the response is `202 Accepted` and the payload typically has `partial=true`, `asOf=null`, and an empty `candles` list.
      operationId: getHistoricalCandles
      security:
        - BearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          description: Market symbol to query.
          schema:
            type: string
            example: AAPL
        - name: from
          in: query
          required: false
          description: Inclusive start date.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end date.
          schema:
            type: string
            format: date
        - name: interval
          in: query
          required: false
          description: Candle interval.
          schema:
            type: string
            default: 1d
            example: 1d
      responses:
        '200':
          description: Candle data retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingCandlesResponseDTO'
        '202':
          description: Backfill accepted and still in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingCandlesResponseDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

