<section class="dashboard-cash-panel">
  <div class="dashboard-cash-heading">
    <div>
      <h2>Cash Management</h2>
      <p class="dashboard-cash-subtitle">Move cash in or out of the selected trading account.</p>
    </div>
    <div class="dashboard-cash-balance">
      <span class="dashboard-cash-label">Available cash</span>
      <strong>${{ cashBalance | number:'1.2-2' }}</strong>
    </div>
  </div>

  @if (cashError) {
    <div class="dashboard-cash-message error-message" role="alert">{{ cashError }}</div>
  }

  @if (cashSuccess) {
    <div class="dashboard-cash-message success-message" role="status">{{ cashSuccess }}</div>
  }

  <div class="dashboard-cash-controls">
    <div class="form-group dashboard-cash-input">
      <label for="dashboard-cash-amount">Amount</label>
      <input
        id="dashboard-cash-amount"
        type="number"
        [ngModel]="cashAmount"
        (ngModelChange)="cashAmountChange.emit($event)"
        name="cashAmount"
        min="0.01"
        step="0.01"
        placeholder="0.00"
      />
    </div>

    <div class="dashboard-cash-actions">
      <button
        type="button"
        class="btn-primary"
        [disabled]="cashLoading || !selectedAccountId"
        (click)="deposit.emit()"
      >
        {{ cashLoading ? 'Processing...' : 'Deposit Funds' }}
      </button>
      <button
        type="button"
        class="btn-secondary"
        [disabled]="cashLoading || !selectedAccountId"
        (click)="withdraw.emit()"
      >
        {{ cashLoading ? 'Processing...' : 'Withdraw Funds' }}
      </button>
    </div>
  </div>
</section>
