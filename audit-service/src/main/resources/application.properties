server.port=8083
spring.application.name=audit-service

# Database configuration with safe local defaults.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tidbits_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Development-only basic auth credentials.
spring.security.user.name=devuser
spring.security.user.password=devpass

# Logging
logging.level.root=INFO
logging.level.com.tidbits.audit=DEBUG
