services:
  postgres:
    image: postgres:18.4
    container_name: tidbits-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/create.sql:/docker-entrypoint-initdb.d/01-create.sql
      - ./db/instruments_inserts.sql:/docker-entrypoint-initdb.d/02-inserts.sql
      - ./db/roles_insert.sql:/docker-entrypoint-initdb.d/03-role_insert.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8

  kafka:
    image: apache/kafka:latest
    container_name: tidbits-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: abcdefghijklmnopqrstuv
    ports:
      - "9092:9092"

  kafka-init:
    image: apache/kafka:latest
    container_name: tidbits-kafka-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      echo "Waiting for Kafka broker at kafka:9092...";
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "kafka:9092" --list >/dev/null 2>&1; do
        sleep 2;
      done;
      echo "Creating topic orders if needed...";
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server "kafka:9092" \
        --create \
        --if-not-exists \
        --topic "orders" \
        --partitions "3" \
        --replication-factor "1";
      echo "Creating topic user-audit-events if needed...";
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server "kafka:9092" \
        --create \
        --if-not-exists \
        --topic "user-audit-events" \
        --partitions "3" \
        --replication-factor "1";
      echo "Kafka topic initialization complete.";
      '
    restart: "no"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tidbits-auth-service
    environment:
      PORT: 4000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_AUDIT_TOPIC: ${KAFKA_USER_AUDIT_TOPIC:-user-audit-events}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    container_name: tidbits-client-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_TOPIC: ${KAFKA_ORDER_TOPIC:-orders}
      KAFKA_USER_AUDIT_TOPIC: ${KAFKA_USER_AUDIT_TOPIC:-user-audit-events}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: tidbits-audit-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_TOPIC: ${KAFKA_ORDER_TOPIC:-orders}
      KAFKA_USER_AUDIT_TOPIC: ${KAFKA_USER_AUDIT_TOPIC:-user-audit-events}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  metrics-service:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: tidbits-metrics-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  audit-frontend:
    build:
      context: ./audit-frontend
      dockerfile: Dockerfile
    container_name: tidbits-audit-frontend
    ports:
      - "8084:80"
    depends_on:
      - audit-service
      - metrics-service

volumes:
  postgres_data: