<header class="app-header" role="banner">
  <div class="header-brand">
    <span class="brand-kicker">Private Client Desk</span>
    <div class="brand-title"><span>Tidbits Trading</span></div>
  </div>

  <div class="header-right">
    @if (accounts.length > 1) {
      <div class="account-selector">
        <select [value]="selectedAccountId" (change)="onAccountSelect($event)" aria-label="Select account">
          @for (acc of accounts; track acc.accountId) {
            <option [value]="acc.accountId">
              {{ acc.nickname }} — {{ formatCurrency(acc.cashBalance) }}
            </option>
          }
        </select>
      </div>
    } @else if (accounts.length === 1) {
      <span style="color:var(--clr-tan);font-size:.85rem;opacity:.8">
        {{ accounts[0].nickname }}
      </span>
    }

    <button class="theme-toggle" type="button" (click)="toggleTheme.emit()"
            [attr.aria-label]="themeMode === 'dark' ? 'Dark mode enabled' : 'Light mode enabled'"
            [attr.title]="themeMode === 'dark' ? 'Dark mode enabled' : 'Light mode enabled'">
      {{ themeMode === 'dark' ? '☾' : '☀' }}
    </button>

    <button class="theme-toggle" type="button" (click)="goToAccount.emit()"
            aria-label="Account settings"
            title="Account settings">
      ⚙
    </button>

    <button class="theme-toggle account-management-toggle" type="button" (click)="goToAccountManagement.emit()"
            aria-label="Trading account management"
            title="Trading account management">
      <svg class="account-management-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.25" fill="currentColor" />
        <path d="M5.5 20c.45-3.55 2.65-5.5 6.5-5.5s6.05 1.95 6.5 5.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
      </svg>
    </button>


    <button class="btn-signout" type="button" (click)="signOut.emit()">Sign Out</button>
  </div>
</header>
