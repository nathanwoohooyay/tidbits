services:
  postgres:
    image: postgres:18.4
    container_name: tidbits-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./db/testdata.sql:/docker-entrypoint-initdb.d/02-testdata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tidbits-auth-service
    environment:
      PORT: 4000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    container_name: tidbits-client-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: tidbits-audit-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: devuser
      SPRING_SECURITY_USER_PASSWORD: devpass
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: