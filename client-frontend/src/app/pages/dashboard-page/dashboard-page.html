<div class="app-shell">
  <app-dashboard-header
    [accounts]="accounts()"
    [selectedAccountId]="selectedAccountId()"
    [rewardPoints]="currentUser()?.rewardPoints ?? currentUser()?.reward_points ?? 0"
    (accountChange)="onAccountChange($event)">
  </app-dashboard-header>

  <main class="app-content" role="main">
    <div class="page dashboard-grid">
      <header class="page-head dashboard-head">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-sub">
            {{ selectedAccount()?.nickname ? 'Balances, holdings and trades for ' + selectedAccount()!.nickname + '.' : 'Balances, holdings and trades.' }}
          </p>
        </div>
        <div class="dashboard-search-row">
          <app-dashboard-stock-search (stockSelected)="openTrade($event)"></app-dashboard-stock-search>
          <app-notification-bell></app-notification-bell>
        </div>
      </header>

      <app-dashboard-metrics
        [loading]="metricsLoading()"
        [totalNetWorth]="totalNetWorth()"
        [cashBalance]="cashBalance()"
        [reservedCash]="reservedCash()"
        [portfolioValue]="portfolioValue()"
        [portfolioGainLoss]="portfolioGainLoss()"
        [dayChange]="dayChange()"
        [dayChangePercent]="dayChangePercent()"
        [unavailable]="!!holdingsError()"
        (moveCash)="openCash()">
      </app-dashboard-metrics>

      @if (!metricsLoading() && !holdingsError()) {
        <app-allocation-bar [holdings]="holdings()" [cash]="cashBalance()"></app-allocation-bar>
      }

      @if (loadError()) {
        <app-error-state title="We couldn't load your accounts" [message]="loadError()" (retry)="retryLoad()"></app-error-state>
      }

      <div class="dashboard-body">
        <div class="dashboard-main">
          <app-dashboard-chart
            [dataPoints]="chartDataPoints()"
            [chartTimeframe]="chartTimeframe()"
            [loading]="chartLoading()"
            (chartTimeframeChange)="setChartTimeframe($event)">
          </app-dashboard-chart>

          <app-dashboard-market-snapshot
            [trendFilter]="trendFilter()"
            (trendFilterChange)="setTrendFilter($event)"
            (trade)="openTrade($event)">
          </app-dashboard-market-snapshot>

          <app-dashboard-open-orders [orders]="orders()" [cancellingId]="cancellingOrderId()" (cancel)="cancelOrder($event)"></app-dashboard-open-orders>

          <app-dashboard-trade-history [orders]="orders()" [loading]="ordersLoading()"></app-dashboard-trade-history>
        </div>

        <aside class="dashboard-rail" aria-label="Account holdings">
          <app-dashboard-holdings
            [holdings]="holdings()"
            [loading]="holdingsLoading()"
            [error]="holdingsError()"
            (trade)="openTrade($event)"
            (retry)="retryHoldings()">
          </app-dashboard-holdings>
          <app-dashboard-watchlist class="rail-watchlist" (trade)="openTrade($event)"></app-dashboard-watchlist>
        </aside>
      </div>
    </div>
  </main>
</div>

<app-dashboard-trade-modal
  [target]="tradeTarget()"
  [accountId]="selectedAccountId()"
  [accountName]="selectedAccount()?.nickname ?? ''"
  [cashBalance]="cashBalance()"
  [ownedQuantity]="ownedQuantity()"
  (closed)="closeTrade()"
  (tradeExecuted)="onTradeExecuted()">
</app-dashboard-trade-modal>

<app-dashboard-cash-modal
  [open]="cashOpen()"
  [accountName]="selectedAccount()?.nickname ?? ''"
  [cashBalance]="cashBalance()"
  [cashAmount]="cashAmount"
  [cashLoading]="cashLoading"
  [cashError]="cashError"
  [cashSuccess]="cashSuccess"
  (cashAmountChange)="cashAmount = $event"
  (deposit)="depositToSelectedAccount()"
  (withdraw)="withdrawFromSelectedAccount()"
  (closed)="closeCash()">
</app-dashboard-cash-modal>
