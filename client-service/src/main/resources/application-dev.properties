server.port=8082
spring.application.name=tidbits-app

# JWT (HS256)
security.jwt.shared-secret=mission-control-shared-secret-key-32-bytes-minimum

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tidbits_dev
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL13Dialect

# Logging
logging.level.root=INFO
logging.level.com.tidbits=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

