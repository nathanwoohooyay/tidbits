# Only CloudFront can reach these ports (the EC2 security group allows just CloudFront's prefix list), so the
# client IP is the last X-Forwarded-For entry, which CloudFront appends. Auth's login limits key on it.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;

# client-frontend's CloudFront distribution: same routes as client-frontend/nginx.conf.
server {
    listen 8090;

    location /api/auth {
        proxy_pass http://auth-service:4000;
    }

    location /api/ {
        proxy_pass http://gateway:3000/client/api/;
    }

    location / {
        return 404;
    }
}

# audit-frontend's CloudFront distribution: same routes as audit-frontend/nginx.conf.
server {
    listen 8084;

    location /api/ {
        proxy_pass http://gateway:3000/audit/api/;
    }

    location /auth-api/ {
        proxy_pass http://auth-service:4000/api/;
    }

    location /metrics-api/ {
        proxy_pass http://metrics-service:8085/api/;
    }

    location / {
        return 404;
    }
}
