        '404':
          description: User log not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token for API authentication.
        To authenticate, obtain a token by calling POST /api/auth/login with valid credentials.
        Then include the token in the Authorization header: Authorization: Bearer {token}

  schemas:
    # ==================== DTOs ====================
    LoginRequestDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john_doe
          description: User's login username
        password:
          type: string
          format: password
          example: SecurePassword123!
          description: User's password

    LoginResponseDTO:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT authentication token for use in subsequent API calls
        user:
          $ref: '#/components/schemas/UserDTO'

    UserDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int32
          example: 1
          description: Unique user identifier
        username:
          type: string
          example: john_doe
          description: User's login username
        email:
          type: string
          format: email
          example: john@example.com
          description: User's email address
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
          description: Account creation timestamp
        phoneNumber:
          type: string
          example: +1-555-0123
          description: User's contact phone number
        lastLogin:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Last login timestamp
        rewardPoints:
          type: integer
          format: int32
          example: 150
          description: Accumulated reward points

    AccountDTO:
      type: object
      properties:
        accountId:
          type: integer
          format: int32
          example: 101
          description: Unique account identifier
        userId:
          type: integer
          format: int32
          example: 1
          description: Associated user ID
        nickname:
          type: string
          example: Main Trading Account
          description: User-defined account nickname
        cashBalance:
          type: number
          format: double
          example: 50000.00
          description: Available cash balance in the account
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
          description: Account creation timestamp

    OrderDTO:
      type: object
      properties:
        orderId:
          type: integer
          format: int32
          example: 501
          description: Unique order identifier
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Instrument being traded
        quantity:
          type: number
          format: double
          example: 100.5
          description: Number of units to trade
        stockPrice:
          type: number
          format: double
          example: 125.75
          description: Price per unit at order time
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        lastUpdatedAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Last order status update timestamp

    InstrumentDTO:
      type: object
      properties:
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Unique instrument identifier
        ticker:
          type: string
          example: AAPL
          description: Stock ticker symbol
        name:
          type: string
          example: Apple Inc.
          description: Full instrument name
        type:
          $ref: '#/components/schemas/InstrumentType'
        market:
          type: string
          example: NASDAQ
          description: Trading market/exchange

    AccountHoldingDTO:
      type: object
      properties:
        holdingId:
          type: integer
          format: int32
          example: 301
          description: Unique holding identifier
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Instrument identifier
        quantity:
          type: number
          format: double
          example: 50.25
          description: Number of units held
        amountInvested:
          type: number
          format: double
          example: 6287.50
          description: Total amount invested in this holding
        lastUpdated:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Last update timestamp

    AccountTransactionDTO:
      type: object
      properties:
        transactionId:
          type: integer
          format: int32
          example: 401
          description: Unique transaction identifier
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        orderId:
          type: integer
          format: int32
          example: 501
          description: Related order ID (if applicable)
        amount:
          type: number
          format: double
          example: 1000.00
          description: Transaction amount
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        createdAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Transaction creation timestamp

    RoleDTO:
      type: object
      properties:
        roleId:
          type: integer
          format: int32
          example: 1
          description: Unique role identifier
        name:
          $ref: '#/components/schemas/RoleType'

    ChangePasswordDTO:
      type: object
      required:
        - oldPassword
        - newPassword
        - confirmPassword
      properties:
        oldPassword:
          type: string
          format: password
          description: Current password for verification
        newPassword:
          type: string
          format: password
          description: New password to set
        confirmPassword:
          type: string
          format: password
          description: Confirmation of new password (must match newPassword)

    ErrorResponseDTO:
      type: object
      properties:
        errorCode:
          type: string
          example: ERR_USER_NOT_FOUND
          description: Machine-readable error code
        message:
          type: string
          example: User with ID 999 not found
          description: Human-readable error message
        timestamp:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Error occurrence timestamp
        path:
          type: string
          example: /api/users/999
          description: API path where error occurred
        status:
          type: integer
          format: int32
          example: 404
          description: HTTP status code

    # ==================== ENTITIES ====================
    User:
      type: object
      required:
        - username
        - email
        - phoneNumber
        - passwordHash
        - roleId
      properties:
        userId:
          type: integer
          format: int32
          example: 1
          description: Unique user identifier (auto-generated)
        roleId:
          type: integer
          format: int32
          example: 1
          description: User's role ID
        username:
          type: string
          example: john_doe
          description: Unique username for login
        email:
          type: string
          format: email
          example: john@example.com
          description: Unique email address
        passwordHash:
          type: string
          format: password
          description: Hashed password (never returned in responses)
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
          description: Account creation timestamp (auto-generated)
        phoneNumber:
          type: string
          example: +1-555-0123
          description: User's contact phone number
        lastLogin:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Last login timestamp
        rewardPoints:
          type: integer
          format: int32
          example: 150
          description: Accumulated reward points

    Account:
      type: object
      required:
        - userId
      properties:
        accountId:
          type: integer
          format: int32
          example: 101
          description: Unique account identifier (auto-generated)
        userId:
          type: integer
          format: int32
          example: 1
          description: Associated user ID
        nickname:
          type: string
          example: Main Trading Account
          description: User-defined account nickname
        cashBalance:
          type: number
          format: double
          example: 50000.00
          description: Available cash balance
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
          description: Account creation timestamp (auto-generated)

    Order:
      type: object
      required:
        - accountId
        - instrumentId
        - quantity
        - stockPrice
        - orderType
      properties:
        orderId:
          type: integer
          format: int32
          example: 501
          description: Unique order identifier (auto-generated)
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Instrument being traded
        quantity:
          type: number
          format: double
          example: 100.5
          description: Number of units to trade
        stockPrice:
          type: number
          format: double
          example: 125.75
          description: Price per unit
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        lastUpdatedAt:
          type: string
          format: date-time
          description: Last status update timestamp

    Instrument:
      type: object
      required:
        - ticker
        - name
        - type
      properties:
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Unique instrument identifier (auto-generated)
        ticker:
          type: string
          example: AAPL
          description: Stock ticker symbol
        name:
          type: string
          example: Apple Inc.
          description: Full instrument name
        type:
          $ref: '#/components/schemas/InstrumentType'
        market:
          type: string
          example: NASDAQ
          description: Trading market/exchange

    AccountHolding:
      type: object
      properties:
        holdingId:
          type: integer
          format: int32
          example: 301
          description: Unique holding identifier
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        instrumentId:
          type: integer
          format: int32
          example: 201
          description: Instrument identifier
        quantity:
          type: number
          format: double
          example: 50.25
          description: Number of units held
        amountInvested:
          type: number
          format: double
          example: 6287.50
          description: Total amount invested
        lastUpdated:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Last update timestamp

    AccountTransaction:
      type: object
      required:
        - accountId
        - amount
        - transactionType
      properties:
        transactionId:
          type: integer
          format: int32
          example: 401
          description: Unique transaction identifier (auto-generated)
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        orderId:
          type: integer
          format: int32
          example: 501
          description: Related order ID (if applicable)
        amount:
          type: number
          format: double
          example: 1000.00
          description: Transaction amount
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        createdAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Transaction creation timestamp (auto-generated)

    OrderStatusHistory:
      type: object
      properties:
        historyId:
          type: integer
          format: int32
          example: 601
          description: Unique history entry identifier
        orderId:
          type: integer
          format: int32
          example: 501
          description: Associated order ID
        status:
          $ref: '#/components/schemas/OrderStatus'
        changedAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Status change timestamp

    Role:
      type: object
      required:
        - name
      properties:
        roleId:
          type: integer
          format: int32
          example: 1
          description: Unique role identifier (auto-generated)
        name:
          $ref: '#/components/schemas/RoleType'

    TransactionLog:
      type: object
      properties:
        logId:
          type: integer
          format: int32
          example: 701
          description: Unique log identifier
        accountId:
          type: integer
          format: int32
          example: 101
          description: Associated account ID
        transactionId:
          type: integer
          format: int32
          example: 401
          description: Associated transaction ID
        amount:
          type: number
          format: double
          example: 1000.00
          description: Transaction amount
        type:
          $ref: '#/components/schemas/TransactionType'
        createdAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Log creation timestamp

    UserLog:
      type: object
      properties:
        logId:
          type: integer
          format: int32
          example: 801
          description: Unique log identifier
        userId:
          type: integer
          format: int32
          example: 1
          description: Associated user ID
        action:
          type: string
          example: LOGIN
          description: User action logged
        status:
          $ref: '#/components/schemas/LogStatus'
        createdAt:
          type: string
          format: date-time
          example: 2024-09-22T14:45:30Z
          description: Log creation timestamp

    # ==================== ENUMS ====================
    OrderType:
      type: string
      enum:
        - BUY
        - SELL
      example: BUY
      description: Type of order

    OrderStatus:
      type: string
      enum:
        - CREATED
        - PENDING
        - PLACED
        - ACCEPTED
        - FILLED
        - CANCELED
        - REJECTED
      example: PLACED
      description: Current order status

    TransactionType:
      type: string
      enum:
        - BUY
        - SELL
        - DEPOSIT
        - WITHDRAW
      example: BUY
      description: Type of transaction

    InstrumentType:
      type: string
      enum:
        - STOCK
        - BOND
        - MUTUAL_FUND
        - COMMODITY
      example: STOCK
      description: Type of trading instrument

    RoleType:
      type: string
      enum:
        - ADMIN
        - USER
        - TRADER
        - ANALYST
      example: USER
      description: User role type

    LogStatus:
      type: string
      enum:
        - SUCCESS
        - FAILURE
        - PENDING
      example: SUCCESS
      description: Status of logged action
