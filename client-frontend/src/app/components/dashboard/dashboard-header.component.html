<aside class="app-sidebar" aria-label="Primary">
  <div class="sidebar-brand">
    <app-brand-logo [size]="30"></app-brand-logo>
    <div class="brand-text">
      <span class="brand-title">BitTrader</span>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Main navigation">
    <button type="button" class="nav-item" routerLink="/maindashboard" routerLinkActive="active" title="Portfolio overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
      <span class="nav-label">Overview</span>
    </button>
    <button type="button" class="nav-item" routerLink="/dashboard" routerLinkActive="active" title="Trading dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
      <span class="nav-label">Dashboard</span>
    </button>
    <button type="button" class="nav-item" routerLink="/rewards" routerLinkActive="active"
            [attr.aria-label]="'Rewards: ' + points + ' points'" title="Spend your reward points">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.8 2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5 2.7.9-5.6-4-3.9 5.6-.8z"/></svg>
      <span class="nav-label">Rewards</span>
      <span class="nav-badge">{{ points | number }}</span>
    </button>
    <button type="button" class="nav-item" routerLink="/account-management" routerLinkActive="active"
            aria-label="Trading account management" title="Trading account management">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="2"/><path d="M3.5 10h17M16 14.5h1.5"/><path d="M6.5 6 15 3.5 16.2 6"/></svg>
      <span class="nav-label">Trading accounts</span>
    </button>
    <button type="button" class="nav-item" routerLink="/account" routerLinkActive="active"
            aria-label="Account settings" title="Account settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </nav>

  @if (showAccountSelector && accounts.length > 0) {
    <div class="sidebar-account">
      @if (accounts.length > 1) {
        <label class="sidebar-label" for="sidebar-account-select">Trading account</label>
        <div class="account-selector">
          <select id="sidebar-account-select" [value]="selectedAccountId" (change)="onAccountSelect($event)" aria-label="Select account">
            @for (acc of accounts; track acc.accountId) {
              <option [value]="acc.accountId" [selected]="acc.accountId === selectedAccountId">
                {{ acc.nickname }} — {{ formatCurrency(acc.cashBalance) }}
              </option>
            }
          </select>
        </div>
      } @else {
        <span class="sidebar-label">Trading account</span>
        <span class="sidebar-account-name">{{ accounts[0].nickname }}</span>
      }
    </div>
  }

  <div class="sidebar-footer">
    <button class="nav-item" type="button" role="switch" (click)="toggleTheme()"
            [attr.aria-checked]="themeMode() === 'dark'" title="Toggle dark mode">
      @if (themeMode() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      }
      <span class="nav-label">Dark mode</span>
    </button>
    <button class="nav-item nav-signout" type="button" (click)="signOut()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>
      <span class="nav-label">Sign Out</span>
    </button>
  </div>
</aside>
