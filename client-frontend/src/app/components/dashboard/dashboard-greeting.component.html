<header class="page-head" aria-label="Greeting">
  <div>
    @if (loading) {
      <span class="skeleton greeting-skeleton-title"></span>
      <span class="skeleton skeleton-line greeting-skeleton-sub"></span>
    } @else {
      <h1 class="page-title">Hello {{ username }}</h1>
      <p class="page-sub">{{ accountNickname }} · {{ today | date:'EEEE, MMMM d, y' }}</p>
    }
  </div>
  <ng-content></ng-content>
</header>
