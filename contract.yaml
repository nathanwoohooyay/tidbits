openapi: 3.0.3
info:
  title: Tidbits Trading Platform API
  version: 2.0.0
  summary: Multi-service API contract for authentication, trading, pricing, and audit workflows.
  description: |
    This contract replaces the previous draft and documents the API surface that is actually implemented in the workspace.

    The platform is split into four runtime pieces:

    1. `auth-service` issues JWT access tokens and manages refresh cookies.
    2. `client-service` owns user self-service trading workflows such as accounts, holdings, orders, cash movements, and pricing.
    3. `audit-service` exposes admin reporting, role management, and audit-log read operations.
    4. `gateway` is a thin reverse proxy. It forwards client-service routes under `/client/*` and audit-service routes under `/audit/*`. Auth routes are not proxied by the current gateway implementation.

    Important behavior to understand before integrating:

    - Access tokens are JWT bearer tokens signed with a shared HS256 secret.
    - Refresh tokens are stored in an HTTP-only cookie named `refreshToken` and are only used by auth endpoints.
    - User self-service routes under `/api/users/{userId}` and `/api/users/{userId}/accounts` enforce that the JWT subject matches the path `userId`.
    - Account-scoped routes under `/api/accounts/{accountId}/...` are authenticated, but the current client-service implementation does not additionally compare `accountId` against the JWT subject.
    - Audit write routes for user logs and transaction logs exist in controllers, but the current audit-service security configuration denies those non-GET requests. They are documented here with that limitation called out explicitly.
    - Several endpoints intentionally accept primitive bodies instead of JSON objects: account nicknames are raw strings, deposit and withdraw amounts are raw numbers, and some user updates are raw strings.
    - Historical candle requests can return `202 Accepted` when a backfill has been kicked off and data is not ready yet.

    Server usage:

    - Use `http://localhost:4000` for `/api/auth/*`.
    - Use `http://localhost:8082` for client-service trading paths.
    - Use `http://localhost:8083` for audit-service admin, roles, and audit-log paths.
    - If you go through the gateway at `http://localhost:3000`, prepend `/client` to every client-service path and `/audit` to every audit-service path.
x-service-base-urls:
  auth: http://localhost:4000
  # client: http://localhost:8082
  # audit: http://localhost:8083
  gateway:
    client: http://localhost:3000/client
    audit: http://localhost:3000/audit
tags:
  - name: Authentication
    description: Auth-service routes for registration, login, refresh-token exchange, logout, and health checks.
  - name: Users
    description: Client-service routes for reading and updating the authenticated user's own profile data.
  - name: Accounts
    description: Client-service routes for creating, listing, renaming, and deleting trading accounts owned by a user.
  - name: Holdings
    description: Client-service routes for viewing current portfolio holdings on an account.
  - name: Orders
    description: Client-service routes for placing orders and reading order history.
  - name: Pricing
    description: Client-service market-data routes for quotes and historical candles.
  - name: Admin
    description: Audit-service routes for platform administration and user-level oversight.
  - name: Roles
    description: Audit-service routes for reading roles and reassigning a user's role.
  - name: User Logs
    description: Audit-service routes for user audit-log retrieval and controller-level write operations.
  - name: Transaction Logs
    description: Audit-service routes for transaction audit-log retrieval and controller-level write operations.

paths:
  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register a new platform user
      description: |
        Creates a new user in PostgreSQL with the default signup role of `client`.

        Validation rules implemented by auth-service:

        - `username`, `email`, `password`, `phoneNumber`, and `dateOfBirth` must all be non-empty strings.
        - `email` must match a basic email format.
        - `password` must be 8 to 20 characters and include at least one lowercase letter, one uppercase letter, and one digit.
        - `phoneNumber` is validated as a US number and normalized internally.

        A successful signup returns a compact user summary from auth-service using the exact JSON keys emitted by the Node implementation.
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '422':
          $ref: '#/components/responses/AuthUnprocessableEntity'
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate with username and password
      description: |
        Verifies credentials, updates `last_login`, stores a hashed refresh token in the database, sets the `refreshToken` HTTP-only cookie, and returns a short-lived JWT access token in the response body.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Exchange the refresh cookie for a new access token
      description: |
        Reads the `refreshToken` cookie, hashes it, validates it against the `refresh_tokens` table, checks expiry, and returns a new access token.

        The login route returns the access token under `token`, while this route returns it under `accessToken`. That naming difference is current implemented behavior.
      operationId: refreshAccessToken
      security:
        - RefreshTokenCookie: []
      responses:
        '200':
          description: Access token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out and clear the refresh token
      description: |
        Deletes the hashed refresh token from the database when present and always clears the `refreshToken` cookie. The endpoint returns `204 No Content`, even if the cookie is already missing.
      operationId: logoutUser
      responses:
        '204':
          description: Logout completed and refresh cookie cleared.
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/health:
    get:
      tags:
        - Authentication
      summary: Auth service health check
      description: Lightweight readiness endpoint exposed by auth-service.
      operationId: authHealth
      responses:
        '200':
          description: Auth service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/users/{userId}:
    get:
      tags:
        - Users
      summary: Get the authenticated user's profile
      description: |
        Returns a `UserDTO` for the requested user.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/users/{userId}/change-password:
    patch:
      tags:
        - Users
      summary: Change the authenticated user's password
      description: |
        Updates the password for the target user.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: changePassword
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDTO'
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/users/{userId}/change-email:
    patch:
      tags:
        - Users
      summary: Change the authenticated user's email address
      description: |
        Accepts a raw string body instead of a JSON object.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: changeEmail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example: trader.updated@example.com
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example: trader.updated@example.com
      responses:
        '200':
          description: Email changed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/users/{userId}/change-phone-number:
    patch:
      tags:
        - Users
      summary: Change the authenticated user's phone number
      description: |
        Accepts a raw string body instead of a JSON object.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: changePhoneNumber
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/PhoneNumberChangeRequest'
            example: 5550123
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberChangeRequest'
            example: 5550123
      responses:
        '200':
          description: Phone number changed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/users/{userId}/accounts:
    get:
      tags:
        - Accounts
      summary: List all trading accounts for a user
      description: |
        Returns every account owned by the specified user.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: getAllAccountsByUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Accounts retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'
    post:
      tags:
        - Accounts
      summary: Create a new trading account
      description: |
        Creates an account for the specified user.

        The request body is a raw nickname string, not a JSON object.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: createAccount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/AccountNicknameRequest'
            example: Main Trading Account
          application/json:
            schema:
              $ref: '#/components/schemas/AccountNicknameRequest'
            example: Main Trading Account
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/users/{userId}/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get a single trading account
      description: |
        Returns one account owned by the specified user.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: getAccountById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AccountIdById'
      responses:
        '200':
          description: Account retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'
    put:
      tags:
        - Accounts
      summary: Rename an account
      description: |
        Accepts a raw nickname string and returns `202 Accepted` with an empty body.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: updateAccount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AccountIdById'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/AccountNicknameRequest'
            example: Retirement Account
          application/json:
            schema:
              $ref: '#/components/schemas/AccountNicknameRequest'
            example: Retirement Account
      responses:
        '202':
          description: Account rename accepted.
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'
    delete:
      tags:
        - Accounts
      summary: Delete an account
      description: |
        Deletes the target account.

        Authorization rule: the JWT subject must equal the `userId` path parameter.
      operationId: deleteAccount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AccountIdById'
      responses:
        '204':
          description: Account deleted successfully.
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/holdings/{holdingId}:
    get:
      tags:
        - Holdings
      summary: Get one holding on an account
      description: |
        Returns a single holding DTO.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: getAccountHoldingById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/HoldingId'
      responses:
        '200':
          description: Holding retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHoldingDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/holdings/:
    get:
      tags:
        - Holdings
      summary: List all holdings on an account
      description: |
        Returns every holding for the target account.

        Note the trailing slash. It is part of the implemented mapping.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: getAllAccountHoldings
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Holdings retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountHoldingDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/deposit:
    post:
      tags:
        - Accounts
      summary: Deposit cash into an account
      description: |
        Accepts a raw numeric request body representing the amount to deposit.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: depositTransaction
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
            example: 1000.0
          text/plain:
            schema:
              $ref: '#/components/schemas/AmountRequest'
            example: 1000.0
      responses:
        '200':
          description: Deposit recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransactionDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/withdraw:
    post:
      tags:
        - Accounts
      summary: Withdraw cash from an account
      description: |
        Accepts a raw numeric request body representing the amount to withdraw.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: withdrawTransaction
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
            example: 250.0
          text/plain:
            schema:
              $ref: '#/components/schemas/AmountRequest'
            example: 250.0
      responses:
        '200':
          description: Withdrawal recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransactionDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/transactions:
    get:
      tags:
        - Accounts
      summary: List all transactions on an account
      description: |
        Returns deposits, withdrawals, and order-linked transactions for the target account.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: getAccountTransactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Transactions retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountTransactionDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/transactions/{transactionId}:
    get:
      tags:
        - Accounts
      summary: Get one account transaction
      description: |
        Returns a single account transaction.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user before lookup; instead it compares the loaded transaction's `accountId` afterward.
      operationId: getAccountTransactionById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransactionDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/orders:
    get:
      tags:
        - Orders
      summary: List all orders on an account
      description: |
        Returns the order book for the target account.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: getAllOrdersByAccountId
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Orders retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponseDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'
    post:
      tags:
        - Orders
      summary: Submit a new order request
      description: |
        Accepts an order payload and overwrites any body-level `accountId` with the `accountId` path parameter before calling the service layer.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: requestOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '202':
          description: Order accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDTO'
        '400':
          $ref: '#/components/responses/ServiceBadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '422':
          $ref: '#/components/responses/ServiceUnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/accounts/{accountId}/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get one order on an account
      description: |
        Returns a single order and its status history.

        Current implementation detail: the route requires a valid JWT through client-service security, but the controller does not verify that `accountId` belongs to the authenticated user.
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDTO'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '404':
          $ref: '#/components/responses/ServiceNotFound'
        '500':
          $ref: '#/components/responses/ServiceInternalServerError'

  /api/orders/{orderId}/history:
    get:
      tags:
        - Orders
      summary: Get the status history for an order
      description: |
        Returns every recorded status transition for the target order.

        The route is protected by client-service security because it matches `/api/orders/**`.
      operationId: getAllOrderStatusHistories
      security:
