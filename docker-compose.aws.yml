# AWS deployment: runs on the EC2 instance. The frontends live in S3 behind CloudFront, so this file doesn't build
# them; CloudFront forwards each frontend's API paths to the edge nginx (ports 8090 and 8084). See DEPLOY.md.
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Not exposed to the internet; reach it over SSH (`docker compose -f docker-compose.aws.yml exec postgres psql ...`).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/create.sql:/docker-entrypoint-initdb.d/01-create.sql
      - ./db/create_auth_db.sql:/docker-entrypoint-initdb.d/02-create-auth-db.sql
      - ./db/tidbits_auth_seed.sql:/docker-entrypoint-initdb.d/03-tidbits-auth-seed.sql
      - ./db/tidbits_dev_seed.sql:/docker-entrypoint-initdb.d/04-tidbits-dev-seed.sql
      - ./db/spread_timestamps.sql:/docker-entrypoint-initdb.d/05-spread-timestamps.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: abcdefghijklmnopqrstuv
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done;
      for topic in orders user-audit-events points-events; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1;
      done;
      echo "Kafka topic initialization complete.";
      '
    restart: "no"

  auth-service:
    build:
      context: ./auth-service
    environment:
      PORT: 4000
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS}
      AUTH_COOKIE_SECURE: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_AUTH_NAME: tidbits_auth
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_AUDIT_TOPIC: user-audit-events
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_TOPIC: orders
      KAFKA_USER_AUDIT_TOPIC: user-audit-events
      KAFKA_POINTS_TOPIC: points-events
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_TOPIC: orders
      KAFKA_USER_AUDIT_TOPIC: user-audit-events
      KAFKA_POINTS_TOPIC: points-events
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    environment:
      PORT: 3000
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS}
      CLIENT_SERVICE_URL: http://client-service:8082
      AUDIT_SERVICE_URL: http://audit-service:8083
      METRICS_SERVICE_URL: http://metrics-service:8085
      AUTH_SERVICE_URL: http://auth-service:4000
      DB_AUTH_HOST: postgres
      DB_AUTH_PORT: 5432
      DB_AUTH_NAME: tidbits_auth
      DB_AUTH_USER: ${DB_USER}
      DB_AUTH_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      client-service:
        condition: service_started
      audit-service:
        condition: service_started
    restart: unless-stopped

  metrics-service:
    build:
      context: .
      dockerfile: data/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Stands in for the frontends' nginx: same API routes, minus the static files (those are in S3 now).
  edge:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:8090" # client-frontend API
      - "8084:8084" # audit-frontend API
    depends_on:
      - gateway
      - auth-service
      - metrics-service
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
