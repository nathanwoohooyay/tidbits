<div class="login-card">
  <div class="login-brand">
    <app-brand-logo [size]="28"></app-brand-logo>
    <span class="brand-name">BitTrader</span>
  </div>
  <h1 class="login-heading">Sign in</h1>
  <!-- Errors and notices take the subtitle's place, so the form never changes height. -->
  @if (loginError) {
    <p class="login-sub login-status is-error" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.01"/></svg>{{ loginError }}</p>
  } @else if (accountCreated) {
    <p class="login-sub login-status is-success" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Account created. Sign in to get started.</p>
  } @else {
    <p class="login-sub">Use your account credentials to continue.</p>
  }

  <div class="form-group">
    <label for="login-username">Username</label>
    <input
      id="login-username"
      type="text"
      [(ngModel)]="loginUsername"
      placeholder="e.g. john_investor"
      autocomplete="username"
      (ngModelChange)="onLoginInputChange()"
      (keyup.enter)="login()"
    />
  </div>

  <div class="form-group">
    <label for="login-password">Password</label>
    <input
      id="login-password"
      type="password"
      [(ngModel)]="loginPassword"
      placeholder="Enter your password"
      autocomplete="current-password"
      (ngModelChange)="onLoginInputChange()"
      (keyup.enter)="login()"
    />
  </div>

  <!-- Icons only while working: a spinner, then the button fills green with a check. It shakes if sign-in fails. -->
  <button type="button" class="btn-primary auth-submit" (click)="login()" [disabled]="loginLoading || loginDone"
          [class.is-loading]="loginLoading" [class.is-done]="loginDone" [class.is-shake]="shake" [attr.aria-busy]="loginLoading">
    @if (loginDone) {
      <svg class="btn-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span class="sr-only">Signed in</span>
    } @else if (loginLoading) {
      <span class="btn-spinner" aria-hidden="true"></span>
      <span class="sr-only">Signing in</span>
    } @else {
      Sign in
    }
  </button>

  <p class="login-alt">New to BitTrader? <a routerLink="/signup">Create an account</a></p>
</div>
