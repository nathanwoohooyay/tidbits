server.port=8083
spring.application.name=audit-service

app.kafka.order-topic=${KAFKA_ORDER_TOPIC:orders}
app.kafka.user-audit-topic=${KAFKA_USER_AUDIT_TOPIC:user-audit-events}
app.kafka.audit-consumer-group=${KAFKA_AUDIT_CONSUMER_GROUP:audit-service-consumer}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${app.kafka.audit-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Database configuration with safe local defaults.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tidbits_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (HS256) - shared with auth/client services.
security.jwt.shared-secret=${JWT_SECRET}

# Logging
logging.level.root=INFO
logging.level.com.tidbits.audit=DEBUG
