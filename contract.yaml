components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token signed with HS256.

        Auth-service tokens currently include these claims:

        - `sub`: user identifier
        - `roles`: array of uppercase role names consumed as Spring `ROLE_*` authorities
        - `tokenVersion`: integer used by the gateway for token revocation checks
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HTTP-only refresh token cookie set by `POST /api/auth/login`.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Numeric user identifier.
      schema:
        type: integer
        format: int32
    AccountId:
      name: accountId
      in: path
      required: true
      description: Numeric account identifier.
      schema:
        type: integer
        format: int32
    AccountIdById:
      name: id
      in: path
      required: true
      description: Numeric account identifier.
      schema:
        type: integer
        format: int32
    HoldingId:
      name: holdingId
      in: path
      required: true
      description: Numeric holding identifier.
      schema:
        type: integer
        format: int32
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Numeric transaction identifier.
      schema:
        type: integer
        format: int32
    OrderId:
      name: orderId
      in: path
      required: true
      description: Numeric order identifier.
      schema:
        type: integer
        format: int32
    RoleId:
      name: id
      in: path
      required: true
      description: Numeric role identifier.
      schema:
        type: integer
        format: int32
    UserLogId:
      name: id
      in: path
      required: true
      description: Numeric user-log identifier.
      schema:
        type: integer
        format: int32
    TransactionLogId:
      name: transactionId
      in: path
      required: true
      description: Numeric transaction-log identifier as used by the controller path.
      schema:
        type: integer
        format: int32

  responses:
    AuthBadRequest:
      description: Request body failed basic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnauthorized:
      description: Authentication failed or a refresh token was missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthConflict:
      description: A unique auth-service resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthUnprocessableEntity:
      description: Request body was well formed but failed auth-service business validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    AuthInternalServerError:
      description: Auth-service encountered an unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    ServiceBadRequest:
      description: Request payload or parameter values were invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
    ServiceUnauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
    ServiceForbidden:
      description: Authenticated caller is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
    ServiceNotFound:
      description: Requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
    ServiceUnprocessableEntity:
      description: Request passed parsing but violated a business rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
    ServiceInternalServerError:
      description: Downstream Spring service encountered an unexpected failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'

  schemas:
    SignupRequest:
      type: object
      required:
        - username
        - email
        - password
        - phoneNumber
        - dateOfBirth
      properties:
        username:
          type: string
          example: john_doe
          description: Unique login username.
        email:
          type: string
          format: email
          example: john@example.com
          description: Email address validated by auth-service.
        password:
          type: string
          format: password
          example: SecurePass123
          description: 8 to 20 characters, with lowercase, uppercase, and digit.
        phoneNumber:
          type: string
          example: 5550123
          description: US phone number input expected by auth-service validation.
        dateOfBirth:
          type: string
          format: date
          example: 1990-04-15
          description: Date-of-birth string required during signup.

    SignupResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: user created
        user:
          $ref: '#/components/schemas/AuthSignupUser'

    AuthSignupUser:
      type: object
      properties:
        user_id:
          type: integer
          format: int32
          example: 42
        username:
          type: string
          example: john_doe
        email:
          type: string
          format: email
          example: john@example.com
        phoneNumber:
          type: string
          example: 5550123
        created_at:
          type: string
          format: date-time
          example: 2026-10-08T10:15:30Z

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          format: password
          example: SecurePass123

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Access token returned by auth-service after login.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: New access token derived from the refresh cookie.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: up

    AuthErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
        - path
        - status
      properties:
        errorCode:
          type: string
          example: INVALID_LOGIN
        message:
          type: string
          example: invalid username or password
        timestamp:
          type: string
          format: date-time
          example: 2026-10-08T10:15:30Z
        path:
          type: string
          example: /api/auth/login
        status:
          type: integer
          format: int32
          example: 401

    ServiceErrorResponse:
      type: object
      required:
        - timestamp
        - errorCode
        - message
        - status
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-10-08T10:15:30Z
        errorCode:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Transaction 401 not found.
        status:
          type: integer
          format: int32
          example: 404

    UserDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int32
          example: 1
        username:
          type: string
          example: john_doe
        email:
          type: string
          format: email
          example: john@example.com
        phoneNumber:
          type: string
          example: 5550123
        rewardPoints:
          type: integer
          format: int32
          example: 150
        dateOfBirth:
          type: string
          format: date
          example: 1990-04-15

    ChangePasswordDTO:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: OldPass123
        newPassword:
          type: string
          format: password
          example: NewPass123
        confirmPassword:
          type: string
          format: password
          example: NewPass123

    EmailChangeRequest:
      type: string
      format: email
      example: trader.updated@example.com
      description: Raw string request body used by `PATCH /api/users/{userId}/change-email`.

    PhoneNumberChangeRequest:
      type: string
      example: 5550142
      description: Raw string request body used by `PATCH /api/users/{userId}/change-phone-number`.

    AccountNicknameRequest:
      type: string
      example: Main Trading Account
      description: Raw string request body used by account create and rename routes.

    AmountRequest:
      type: number
      format: double
      example: 1000.0
      description: Raw numeric request body used by deposit and withdraw routes.

    AccountDTO:
      type: object
      properties:
        accountId:
          type: integer
          format: int32
          example: 101
        userId:
          type: integer
          format: int32
          example: 1
        nickname:
          type: string
          example: Main Trading Account
        cashBalance:
          type: number
          format: double
          example: 50000.0

    AccountHoldingDTO:
      type: object
      properties:
