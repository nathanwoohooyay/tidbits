openapi: 3.0.3
info:
  title: Tidbits Trading Platform API
  description: RESTful API for a comprehensive trading platform with account management, order processing, and portfolio tracking
  version: 1.0.0
  contact:
    name: Tidbits Development Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.tidbits.com
    description: Production Server

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Users
    description: User management endpoints
  - name: Accounts
    description: Account management endpoints
  - name: Orders
    description: Order processing endpoints
  - name: Instruments
    description: Instrument/Asset catalog endpoints
  - name: Holdings
    description: Portfolio holdings endpoints
  - name: Transactions
    description: Transaction history endpoints
  - name: Roles
    description: Role management endpoints
  - name: Logs
    description: Audit and activity logging endpoints

paths:
  # ==================== AUTHENTICATION ====================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with username and password. Returns JWT token for subsequent requests.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidate the current JWT token
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== USERS ====================
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a list of all users in the system
      operationId: getAllUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Register a new user account in the system
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '409':
          description: Conflict - username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a specific user by their user ID
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    put:
      tags:
        - Users
      summary: Update user
      description: Replace all user information for the specified user ID
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    patch:
      tags:
        - Users
      summary: Partially update user
      description: Update specific fields of a user without replacing all data
      operationId: partiallyUpdateUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Remove a user from the system
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/users/{userId}/change-password:
    patch:
      tags:
        - Users
      summary: Change user password
      description: Update the password for an existing user account
      operationId: changePassword
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDTO'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid password or password mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== ACCOUNTS ====================
  /api/accounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts
      description: Retrieve a list of all trading accounts
      operationId: getAllAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of accounts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Create a new trading account for a user
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input or account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      description: Retrieve a specific account by its account ID
      operationId: getAccountById
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    put:
      tags:
        - Accounts
      summary: Update account
      description: Replace all account information for the specified account ID
      operationId: updateAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    patch:
      tags:
        - Accounts
      summary: Partially update account
      description: Update specific fields of an account without replacing all data
      operationId: partiallyUpdateAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Account partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    delete:
      tags:
        - Accounts
      summary: Delete account
      description: Remove a trading account from the system
      operationId: deleteAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Account deleted successfully
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== ORDERS ====================
  /api/accounts/{accountId}/orders:
    get:
      tags:
        - Orders
      summary: Get all orders for an account
      description: Retrieve a list of all orders for a specific account
      operationId: getAllOrdersByAccountId
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      tags:
        - Orders
      summary: Create a new order
      description: Place a new buy or sell order for the account. Validates balance/holdings and creates order with status CREATED.
      operationId: createOrder
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order or insufficient balance/holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account or Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/accounts/{accountId}/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: Retrieve a specific order from an account
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
        - name: orderId
          in: path
          required: true
          description: Unique order identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Order or Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== INSTRUMENTS ====================
  /api/instruments:
    get:
      tags:
        - Instruments
      summary: Get all instruments
      description: Retrieve a list of all available trading instruments (stocks, bonds, etc.)
      operationId: getAllInstruments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of instruments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      tags:
        - Instruments
      summary: Create a new instrument
      description: Add a new trading instrument to the system
      operationId: createInstrument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instrument'
      responses:
        '200':
          description: Instrument created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          description: Invalid input or instrument already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/instruments/{instrumentId}:
    get:
      tags:
        - Instruments
      summary: Get instrument by ID
      description: Retrieve details of a specific instrument
      operationId: getInstrumentById
      security:
        - BearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          description: Unique instrument identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Instrument retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    patch:
      tags:
        - Instruments
      summary: Update instrument
      description: Update specific fields of an instrument
      operationId: updateInstrument
      security:
        - BearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          description: Unique instrument identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instrument'
      responses:
        '200':
          description: Instrument updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    delete:
      tags:
        - Instruments
      summary: Delete instrument
      description: Remove an instrument from the system
      operationId: deleteInstrument
      security:
        - BearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          description: Unique instrument identifier
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Instrument deleted successfully
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== HOLDINGS ====================
  /api/accounts/{accountId}/holdings/:
    get:
      tags:
        - Holdings
      summary: Get all holdings for an account
      description: Retrieve the portfolio of holdings owned by an account
      operationId: getAllAccountHoldings
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of holdings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountHolding'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/accounts/{accountId}/holdings/{holdingId}:
    get:
      tags:
        - Holdings
      summary: Get holding by ID
      description: Retrieve details of a specific holding in an account's portfolio
      operationId: getAccountHoldingById
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
        - name: holdingId
          in: path
          required: true
          description: Unique holding identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Holding retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolding'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Holding or Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== ACCOUNT TRANSACTIONS ====================
  /api/accounts/{accountId}/transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions for an account
      description: Retrieve a list of all transactions (buy, sell, deposit, withdraw) for an account
      operationId: getAccountTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountTransaction'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      tags:
        - Transactions
      summary: Create a new transaction
      description: Record a new transaction for an account
      operationId: createAccountTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTransaction'
      responses:
        '200':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransaction'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/accounts/{accountId}/transactions/{transactionId}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      description: Retrieve details of a specific transaction
      operationId: getAccountTransactionById
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: integer
            format: int32
        - name: transactionId
          in: path
          required: true
          description: Unique transaction identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransaction'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Transaction or Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== ORDER STATUS HISTORY ====================
  /api/orders/{orderId}/history:
    get:
      tags:
        - Orders
      summary: Get order status history
      description: Retrieve the complete status change history for an order
      operationId: getAllOrderStatusHistories
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique order identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Order status history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderStatusHistory'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== ROLES ====================
  /api/roles:
    get:
      tags:
        - Roles
      summary: Get all roles
      description: Retrieve a list of all available system roles
      operationId: getAllRoles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/roles/{id}:
    get:
      tags:
        - Roles
      summary: Get role by ID
      description: Retrieve a specific role by its ID
      operationId: getRoleById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique role identifier
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    put:
      tags:
        - Roles
      summary: Update role
      description: Replace all role information
      operationId: updateRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique role identifier
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    delete:
      tags:
        - Roles
      summary: Delete role
      description: Remove a role from the system
      operationId: deleteRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique role identifier
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Role deleted successfully
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  # ==================== LOGS - TRANSACTION ====================
  /api/logs/transactions:
    get:
      tags:
